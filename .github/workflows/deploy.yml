# Автопубликация Lingvaden на FTP при каждом изменении ветки main.
# Доступ к FTP хранится в секрете репозитория LINGVADEN_FTP (Settings → Secrets and variables → Actions).
name: Публикация на lingvaden.ru

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим: deploy — опубликовать, check — только проверить FTP"
        type: choice
        options: [deploy, check]
        default: deploy

concurrency:
  group: deploy-lingvaden
  cancel-in-progress: false

jobs:
  build:
    name: Проверка сборки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Утилиты для сборки (pdftotext, Pillow)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null && pip install -q pillow
      - run: python3 -B build.py > /dev/null && echo "Сборка прошла"

  deploy:
    name: Публикация по FTP
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Утилиты для сборки (pdftotext, Pillow)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null && pip install -q pillow
      - name: Доступ к FTP из секрета
        env:
          LINGVADEN_FTP: ${{ secrets.LINGVADEN_FTP }}
        run: |
          if [ -z "$LINGVADEN_FTP" ]; then
            echo "::error::Не задан секрет LINGVADEN_FTP (Settings → Secrets and variables → Actions)"; exit 1
          fi
          mkdir -p handover-private
          printf '%s' "$LINGVADEN_FTP" > handover-private/credentials.json
          python3 -c "import json; d=json.load(open('handover-private/credentials.json')); assert 'ftp' in d, 'в секрете нет ключа ftp'"
      - name: Проверка FTP
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: python3 tools/deploy_ftp.py --check
      - name: Сборка и публикация
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        run: python3 tools/deploy_ftp.py
      - name: Убрать доступы
        if: always()
        run: rm -rf handover-private
